<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Aposentadoria Praia — Praia Digital</title><meta name="description" content="Simulador de renda passiva com imóveis de temporada no litoral: quantos imóveis para se aposentar na praia?"><link rel="canonical" href="https://praia.digital/aposentadoria-praia/"><style>body{font-family:system-ui,sans-serif;margin:0;background:#0b1220;color:#e8ecf1}main{max-width:760px;margin:auto;padding:24px}input{width:100%;padding:10px;border-radius:8px;background:#0f172a;color:#e8ecf1;border:1px solid #243348;margin:4px 0 12px;box-sizing:border-box}.panel{background:#121c2e;border:1px solid #243348;border-radius:14px;padding:20px;margin-bottom:14px}.big{font-size:46px;font-weight:800;color:#22d3ee}.btn{display:inline-block;padding:10px 16px;border-radius:10px;background:#1f6feb;color:#fff;text-decoration:none;font-weight:600;border:0;cursor:pointer}</style></head><body><nav style="background:#0a2540;padding:14px 20px"><span style="color:#fff;font-weight:700;margin-right:16px">🌊 Praia Digital</span><a href="https://praia.digital/apps/" style="color:#9fd8ff;margin-right:12px">Apps</a><a href="https://praia.digital/plano-patrimonio/" style="color:#9fd8ff;margin-right:12px">Plano Patrimônio</a><a href="https://praia.digital/simulador-roi/" style="color:#9fd8ff;margin-right:12px">Simulador ROI</a><a href="https://praia.digital/investidores/" style="color:#9fd8ff">Radar do Investidor</a></nav><main><h1>🏖️ Aposentadoria Praia</h1><p>Quantos imóveis de temporada você precisa para viver de renda no litoral?</p><div class="panel"><label>Renda mensal desejada (R$)</label><input id="m" type="number" value="8000"><label>Valor médio do imóvel (R$)</label><input id="v" type="number" value="450000"><label>Diária média (R$)</label><input id="d" type="number" value="320"><label>Ocupação anual (%)</label><input id="o" type="number" value="55"><label>Custos operacionais (%)</label><input id="c" type="number" value="25"><button class="btn" onclick="go()">Simular</button></div><div class="panel" id="r" style="display:none;text-align:center"><p>Imóveis necessários</p><div class="big" id="n"></div><p id="t"></p><a class="btn" href="https://praia.digital/plano-patrimonio/">Projetar em 10 anos</a> <a class="btn" href="https://praia.digital/simulador-credito/">Simular financiamento</a></div></main><script>function fmt(x){return x.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});}function go(){const m=+document.getElementById('m').value,v=+document.getElementById('v').value,d=+document.getElementById('d').value,o=+document.getElementById('o').value/100,c=+document.getElementById('c').value/100;const renda=d*365*o*(1-c)/12;const n=Math.ceil(m/renda);document.getElementById('r').style.display='block';document.getElementById('n').textContent=n+'x';document.getElementById('t').textContent='Cada imóvel rende ~'+fmt(renda)+'/mês líquido. Investimento total estimado: '+fmt(n*v)+'.';}</script></body></html>
