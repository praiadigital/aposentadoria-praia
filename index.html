<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Aposentadoria Praia — renda passiva de temporada | Praia Digital</title><meta name="description" content="Quantos imóveis de temporada você precisa para se aposentar no litoral? Simule sua renda passiva."><link rel="canonical" href="https://praia.digital/aposentadoria-praia/"><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f8fafc;color:#0f172a;line-height:1.6}.hero{background:linear-gradient(135deg,#0c4a6e,#0ea5e9);color:#fff;padding:60px 20px;text-align:center}.container{max-width:780px;margin:auto;padding:30px 20px}.card{background:#fff;border-radius:13px;padding:24px;margin-bottom:16px;box-shadow:0 3px 10px #0001}label{display:block;font-weight:600;margin:12px 0 4px}input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;box-sizing:border-box}button{background:#0ea5e9;color:#fff;border:0;padding:14px 28px;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer;width:100%;margin-top:16px}.result{text-align:center}.big{font-size:2.2rem;font-weight:800;color:#0ea5e9}a.app{color:#0c4a6e;font-weight:600}footer{text-align:center;padding:24px;color:#64748b}</style></head><body><header class="hero"><h1>🏖️🌅 Aposentadoria Praia</h1><p>Quantos imóveis de temporada você precisa para viver de renda no litoral?</p></header><main class="container"><div class="card"><label>Renda mensal desejada na aposentadoria (R$)</label><input id="meta" type="number" value="8000"><label>Renda líquida média por imóvel de temporada (R$/mês)</label><input id="porImovel" type="number" value="3200"><label>Quanto você tem hoje para investir (R$)</label><input id="hoje" type="number" value="200000"><label>Aporte mensal (R$)</label><input id="aporte" type="number" value="4000"><label>Valor médio do imóvel-alvo (R$)</label><input id="preco" type="number" value="550000"><label>Valorização + rendimento de investimentos (% a.a.)</label><input id="rend" type="number" value="8" step="0.5"><button onclick="calc()">Montar meu plano</button></div><div class="card result" id="out" style="display:none"></div><div class="card"><strong>Construa o plano:</strong><br>🎯 <a class="app" href="https://praia.digital/plano-litoral/">Plano Litoral</a> — acumule a primeira entrada<br>🧮 <a class="app" href="https://praia.digital/calculadora-temporada/">Calculadora de Temporada</a> — renda líquida real por imóvel<br>📈 <a class="app" href="https://praia.digital/valorizador/">Valorizador</a> — seu patrimônio crescendo</div></main><footer><a class="app" href="https://praia.digital/apps/">🌐 Apps Praia Digital</a> · <a class="app" href="https://praia.digital/">praia.digital</a></footer><script>function calc(){var meta=+document.getElementById('meta').value,por=+document.getElementById('porImovel').value,hoje=+document.getElementById('hoje').value,ap=+document.getElementById('aporte').value,preco=+document.getElementById('preco').value,rend=+document.getElementById('rend').value/1200;var n=Math.ceil(meta/por);var patrimonioNecessario=n*preco;var saldo=hoje,meses=0;while(saldo<patrimonioNecessario&&meses<600){saldo=saldo*(1+rend)+ap;meses++;}var anos=(meses/12).toFixed(1);var o=document.getElementById('out');o.style.display='block';if(meses>=600){o.innerHTML='<p>Meta ambiciosa para este ritmo de aporte. Considere aumentar o aporte ou começar com imóveis mais baratos (Peruíbe, Mongaguá).</p>';}else{o.innerHTML='<p>Imóveis necessários para R$ '+meta.toLocaleString('pt-BR')+'/mês:</p><div class="big">'+n+' imóve'+ (n>1?'is':'l')+'</div><p>Patrimônio-alvo: R$ '+patrimonioNecessario.toLocaleString('pt-BR')+'</p><p>Com seus aportes, você chega lá em <strong>'+anos+' anos</strong> — e a renda de cada imóvel comprado acelera o próximo! 🚀</p>';}}</script></body></html>
